# Configuração do banco de dados PostgreSQL (Docker)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=teste
quarkus.datasource.password=123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalogo_servicos

# Recria as tabelas em desenvolvimento e carrega dados iniciais no startup.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Configuração JWT
mp.jwt.verify.issuer=https://meucatalogo.com/issuer
smallrye.jwt.new-token.lifespan=3600

# Configurações usadas no ambiente publicado pelo Render.
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=${PORT:10000}
%prod.smallrye.jwt.sign.key.location=file:///etc/secrets/rsaPrivateKey.pem
%prod.smallrye.jwt.verify.key.location=file:///etc/secrets/publicKey.pem
%prod.smallrye.jwt.verify.key-format=PEM_KEY
%prod.mp.jwt.verify.issuer=https://meucatalogo.com/issuer
